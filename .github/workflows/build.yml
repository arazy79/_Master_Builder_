      - name: Build DTB + Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out CC="${{ env.CC }}" CROSS_COMPILE="${{ env.CROSS_COMPILE }}" dtbs
          echo "=== All DTB files ==="
          find out/arch/arm64/boot/dts -name "*.dtb" | sort
          
          # Cari DTB untuk X00TD (vendor/qcom/ dulu, baru qcom/)
          DTB=$(find out/arch/arm64/boot/dts/vendor/qcom -maxdepth 1 -iname "*x00td*.dtb" | head -1)
          
          if [ -z "$DTB" ]; then
            DTB=$(find out/arch/arm64/boot/dts/vendor/qcom -maxdepth 1 -name "sdm636.dtb" | head -1)
          fi
          
          if [ -z "$DTB" ]; then
            DTB=$(find out/arch/arm64/boot/dts/vendor/qcom -maxdepth 1 -name "sdm660.dtb" | head -1)
          fi
          
          # Fallback ke qcom/ kalau vendor/ kosong
          if [ -z "$DTB" ]; then
            DTB=$(find out/arch/arm64/boot/dts/qcom -maxdepth 1 -name "sdm636.dtb" | head -1)
          fi
          
          if [ -z "$DTB" ]; then
            echo "ERROR: No DTB found! Available DTBs:"
            find out/arch/arm64/boot/dts -name "*.dtb"
            exit 1
          fi
          
          echo "Using DTB: $DTB"
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          echo "=== Size check ==="
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb

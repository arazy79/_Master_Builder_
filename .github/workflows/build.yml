name: Kernel Build X00TD A16 broken

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig name (contoh: x00td_defconfig)'
        required: true
        default: 'x00td_defconfig'
      branch:
        description: 'Branch repo'
        required: true
        default: 'tom'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      AR: llvm-ar
      NM: llvm-nm
      OBJCOPY: llvm-objcopy
      OBJDUMP: llvm-objdump
      STRIP: llvm-strip
      LD: ld.lld

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: arazy79/android_kernel_asus_sdm660-4.19
          ref: ${{ github.event.inputs.branch }}
          path: kernel
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y clang llvm lld

      - name: Debug - Check files
        run: |
          echo "=== Defconfig exists? ==="
          ls -la kernel/arch/arm64/configs/${{ github.event.inputs.defconfig }} || echo "FILE NOT FOUND!"
          echo "=== All defconfigs ==="
          ls -la kernel/arch/arm64/configs/

      - name: Prepare output directory
        run: |
          rm -rf kernel/out
          mkdir -p kernel/out

      - name: Make defconfig
        working-directory: kernel
        run: |
          cp arch/arm64/configs/asus/X00TD_defconfig out/.config
          make ARCH=${{ env.ARCH }} O=out olddefconfig
          
      - name: Build kernel
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out CC="${{ env.CC }}" CROSS_COMPILE="${{ env.CROSS_COMPILE }}" CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}" AR="${{ env.AR }}" NM="${{ env.NM }}" OBJCOPY="${{ env.OBJCOPY }}" OBJDUMP="${{ env.OBJDUMP }}" STRIP="${{ env.STRIP }}" LD="${{ env.LD }}" KCFLAGS="-Wno-error"

      - name: Build DTB + Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out CC="${{ env.CC }}" CROSS_COMPILE="${{ env.CROSS_COMPILE }}" dtbs
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/sdm636.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || \
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/sdm660.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || \
          echo "Check DTB path manually"

      - name: Check build result
        run: |
          echo "=== Boot files ==="
          ls -la kernel/out/arch/arm64/boot/ || true
          echo "=== DTB files ==="
          find kernel/out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null || true

      - name: Upload Image.gz-dtb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 4.19-broken-${{ github.run_id }}-${{ github.event.inputs.defconfig }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image

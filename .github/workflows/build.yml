name: Build SDM660 Kernel (GCC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android /usr/share/swift
          sudo apt-get clean

      - name: Install GCC toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev lz4 \
            squashfs-tools xsltproc zip zlib1g-dev zstd \
            python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: arazy79/SkyWalker_4.4
          ref: r9/hmp
          submodules: recursive
          fetch-depth: 1
          path: kernel

      - name: Build kernel with GCC
        working-directory: kernel
        run: |
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export ARCH="arm64"
          export SUBARCH="arm64"

          make O=out X00TD_defconfig
          make O=out -j$(nproc --all) 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Check build output
        working-directory: kernel
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -lh out/arch/arm64/boot/ 2>/dev/null || echo "NO OUTPUT"
          
          if [ ! -f "out/arch/arm64/boot/Image" ] && [ ! -f "out/arch/arm64/boot/Image.gz" ] && [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "ERROR: No kernel image found!"
            exit 1
          fi

      - name: Print last 50 lines of build log
        if: always()
        working-directory: kernel
        run: |
          echo "=== LAST 50 LINES ==="
          tail -n 50 build.log

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-r9-hmp
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/build.log
          retention-days: 7

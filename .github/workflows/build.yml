name: Build Tiktodz X00TD Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android /usr/share/swift
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev lz4 \
            squashfs-tools xsltproc zip zlib1g-dev zstd \
            python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Tiktodz/android_kernel_asus_sdm636
          ref: tzy
          submodules: recursive
          fetch-depth: 1
          path: kernel

      - name: Build kernel
        working-directory: kernel
        run: |
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export ARCH="arm64"
          export SUBARCH="arm64"

          make O=out X00TD_defconfig
          make O=out -j$(nproc --all) 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Check build output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/
          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "ERROR: No kernel image found!"
            exit 1
          fi

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktodz-x00td
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/build.log
          retention-days: 7

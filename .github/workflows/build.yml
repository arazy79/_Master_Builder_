name: Kernel Build X00TD

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig path (relative to arch/arm64/configs/)'
        required: true
        default: 'vendor/asus/X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick libncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld

      - name: Create output directory
        run: mkdir -p out

      - name: Make defconfig
        run: |
          make O=out \
            ARCH=${{ env.ARCH }} \
            CC=${{ env.CC }} \
            CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            ${{ github.event.inputs.defconfig }}

      - name: Build kernel
        run: |
          make O=out \
            ARCH=${{ env.ARCH }} \
            CC=${{ env.CC }} \
            CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc --all) 2>&1 | tee out/build.log

      - name: Check build result
        run: ls -la out/arch/arm64/boot/

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-kernel-${{ github.run_id }}
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/build.log
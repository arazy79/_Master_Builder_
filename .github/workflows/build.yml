name: Kernel Build X00TD

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig path'
        required: true
        default: 'vendor/asus/X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libwxgtk3.0-gtk3-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y clang llvm lld

      - name: Create output directory
        run: mkdir -p out

      - name: Make defconfig
        run: |
          make O=out ARCH=${{ env.ARCH }} ${{ github.event.inputs.defconfig }}

      - name: Build kernel
        run: |
          make O=out ARCH=${{ env.ARCH }} -j$(nproc --all)

      - name: Check build result
        run: |
          ls -la out/arch/arm64/boot/

      - name: Upload Image.gz-dtb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-kernel-${{ github.run_id }}
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img

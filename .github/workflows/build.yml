name: Kernel Build X00TD

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig path (relatif dari arch/arm64/configs/)'
        required: true
        default: 'vendor/asus/X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
    
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: arazy79/android_kernel_asus_sdm660_tiktod
          ref: tzy
          path: kernel
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y clang llvm lld

      - name: Debug - Check files
        run: |
          echo "=== Kernel directory contents ==="
          ls -la kernel/
          echo "=== Defconfig exists? ==="
          ls -la kernel/arch/arm64/configs/${{ github.event.inputs.defconfig }} || echo "FILE NOT FOUND!"
          echo "=== vendor/asus contents ==="
          ls -la kernel/arch/arm64/configs/vendor/asus/ || echo "DIR NOT FOUND!"

      - name: Prepare output directory
        run: |
          rm -rf kernel/out
          mkdir -p kernel/out

      - name: Make defconfig
        working-directory: kernel
        run: |
          cp arch/arm64/configs/${{ github.event.inputs.defconfig }} out/.config
          make ARCH=${{ env.ARCH }} O=out olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out -j$(nproc --all)

      - name: Check build result
        run: |
          ls -la kernel/out/arch/arm64/boot/

      - name: Upload Image.gz-dtb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-kernel-${{ github.run_id }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
